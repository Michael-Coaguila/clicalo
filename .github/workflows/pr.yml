# Pull-request and main gate (blueprint §10.5). The `verify` job runs exactly `cl check`, the same command
# maintainers run locally, so a green `cl check` on a PC means a green check here.
#
# Rules for this file (blueprint §10.5, §12.2 T12 and T14; `cl check` enforces the first one):
# - every action is pinned by full commit SHA with its version as a comment (Renovate keeps both current);
# - permissions are read-only at the top and widened per job only where a job needs it;
# - no pull_request_target, no secrets: pull requests from forks run read-only;
# - no top-level env or defaults (OpenSSF Scorecard rejects published results otherwise).
name: pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One run per pull request (a new push cancels the old run); pushes to main never cancel each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (x64)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET (global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/packages.lock.json', '.config/dotnet-tools.json', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: cl check
        shell: pwsh
        run: .\cl.cmd check

      - name: Upload cl report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cl-report-x64
          path: artifacts/cl/
          if-no-files-found: ignore
          retention-days: 14

  desk:
    name: desk (x64)
    # Desktop tests (SendInput into InputProbe, foreground): S0 proved hosted windows-2025 runners support them
    # (docs/testing/spikes/S0.md), so they gate every pull request instead of waiting for the touch lab. Since M2 they
    # include S7, the panel and the tray, and the Sentinel chaos of S9 (Category=Chaos, only here).
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CI: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET (global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/packages.lock.json', '.config/dotnet-tools.json', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: cl desk
        shell: pwsh
        run: .\cl.cmd desk

      - name: Upload cl report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cl-report-desk-x64
          path: artifacts/cl/
          if-no-files-found: ignore
          retention-days: 14

  perf:
    name: perf (x64)
    # Spike S5 and the touch -> SendInput budget (blueprint §10.3, docs/testing/spikes/S5.md). It gates: each budget of
    # data/catalogs/budgets.json says where it fails the run. The M2 exit criterion (touch -> SendInput p95 <= 50 ms)
    # has the gate everyRun, so a slower run fails here; the S5 start-up budgets have the gate touchLab and are a trend
    # here, until lab.yml repeats them on the touch lab with CLICALO_PERF_GATE=1. It never continues on error: the build
    # tests (WorkflowGateTests) reject that.
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CI: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET (global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/packages.lock.json', '.config/dotnet-tools.json', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: cl perf
        shell: pwsh
        run: .\cl.cmd perf

      - name: Publish the numbers
        if: always()
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem artifacts/perf -Filter *.md -File -ErrorAction SilentlyContinue | Sort-Object Name)
          if ($reports.Count -eq 0) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value "perf: no hay números (la medición no llegó a escribirlos)."
          }
          foreach ($report in $reports) {
            Get-Content -Path $report.FullName -Raw -Encoding utf8 | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }

      - name: Upload the numbers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-x64
          path: |
            artifacts/perf/*.json
            artifacts/perf/*.md
            artifacts/perf/*.txt
            artifacts/cl/
          if-no-files-found: warn
          retention-days: 30

  adr:
    name: adr
    # Blueprint §13: a pull request that touches a path of architecture/sensitive-paths.json needs an ADR.
    if: github.event_name == 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The test merge commit and its first parent (the base branch): HEAD^1...HEAD is the pull request.
          fetch-depth: 2

      - name: Set up .NET (global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/packages.lock.json', '.config/dotnet-tools.json', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: adr-check
        shell: pwsh
        run: dotnet run --project tools/Clicalo.DevCli -- adr-check --base HEAD^1

  dco:
    name: dco
    # ADR-0015: every commit of a pull request carries the Developer Certificate of Origin line
    # `Signed-off-by: Name <author email>`. Only the pull request's own commits are checked (base..head), never
    # the history that is already on main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so both ends of base..head are present.
          fetch-depth: 0

      - name: Signed-off-by on every commit
        shell: bash
        env:
          # Passed through the environment, never interpolated into the script (injection-safe).
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          count=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            count=$((count + 1))
            author=$(git show -s --format='%ae' "$sha")
            signoffs=$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")
            # Case-insensitive: the sign-off must name the commit's author email.
            if [[ "${signoffs,,}" != *"<${author,,}>"* ]]; then
              echo "::error title=DCO::El commit ${sha:0:12} no lleva «Signed-off-by: Nombre <$author>». Añádelo con git commit --amend -s (o git rebase --signoff) y vuelve a subir la rama; cl setup instala un hook que lo pone solo."
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "dco: $missing de $count commits sin Signed-off-by de su autor."
            exit 1
          fi
          echo "dco: $count commits en el PR, todos con Signed-off-by de su autor."

  verify-arm64:
    name: verify (arm64)
    # Hosted ARM64 runners and the analyses below are free only for public repositories (today it is private).
    if: github.event.repository.private == false
    runs-on: windows-11-arm
    timeout-minutes: 40
    env:
      CI: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET (global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/packages.lock.json', '.config/dotnet-tools.json', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: cl check
        shell: pwsh
        run: .\cl.cmd check

      - name: Upload cl report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cl-report-arm64
          path: artifacts/cl/
          if-no-files-found: ignore
          retention-days: 14

  codeql:
    name: codeql (${{ matrix.language }})
    if: github.event.repository.private == false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
            runner: windows-2025
          - language: actions
            build-mode: none
            runner: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET (global.json)
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: cl build
        if: matrix.language == 'csharp'
        shell: pwsh
        env:
          CI: true
          # The extractor must see every compiler invocation, not a shared compiler server.
          UseSharedCompilation: false
        run: .\cl.cmd build

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  scorecard:
    name: scorecard
    # Scorecard supports push to the default branch; results are published for public repositories only.
    if: github.event.repository.private == false && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard.sarif
