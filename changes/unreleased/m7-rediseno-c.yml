# Novedad para usuarios (ACT-004, blueprint §11): la app la muestra y viaja en el manifiesto firmado.
# Una frase por idioma, en palabras de usuario, sin jerga ni nombres internos.
type: feat # feat, fix, a11y o perf
es: "Un aspecto nuevo y más claro: botones del mismo tamaño, lo elegido se ve siempre igual y el centro de control se puede minimizar, maximizar y acoplar a un lado de la pantalla."
en: "A new, clearer look: buttons of the same size, what you choose always looks the same, and the Control Center can be minimized, maximized and snapped to a side of the screen."
