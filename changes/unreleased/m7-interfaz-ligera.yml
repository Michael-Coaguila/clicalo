# Novedad para usuarios (ACT-004, blueprint §11): la app la muestra y viaja en el manifiesto firmado.
# Una frase por idioma, en palabras de usuario, sin jerga ni nombres internos.
type: feat # feat, fix, a11y o perf
es: "Un panel y una pestaña más ligeros: la talla S y la vista Compacta ocupan de verdad menos, la barra de la pestaña muestra más atajos con sus herramientas en iconos y los botones desactivados ya no parecen huecos vacíos."
en: "A lighter panel and Tab: size S and the Compact view really take less room, the Tab bar shows more shortcuts with its tools as icons, and disabled buttons no longer look like empty slots."
