# Novedad para usuarios (ACT-004, blueprint §11): la app la muestra y viaja en el manifiesto firmado.
# Una frase por idioma, en palabras de usuario, sin jerga ni nombres internos.
type: fix # feat, fix, a11y o perf
es: "Con el trackpad, desplazar desde la pestaña ya no mueve el cursor a la app; los ajustes rápidos del panel se abren enteros a su lado; el panel ya no deja una franja vacía con una sola página; la vista compacta muestra sus avisos un momento bajo el panel; la pestaña ya no tapa la app con «enviado» y su asa plegada lleva la marca de Clícalo."
en: "With a touchpad, scrolling from the edge tab no longer moves the cursor into the app; the panel’s quick settings open whole beside it; the panel no longer leaves an empty band with a single page; the compact view shows its notices for a moment under the panel; the edge tab no longer covers the app with “sent” and its folded handle carries the Clícalo mark."
