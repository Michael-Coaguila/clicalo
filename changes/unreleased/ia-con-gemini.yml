# Novedad para usuarios (ACT-004, blueprint §11): la app la muestra y viaja en el manifiesto firmado.
# Una frase por idioma, en palabras de usuario, sin jerga ni nombres internos.
type: feat # feat, fix, a11y o perf
es: "«Crear con IA» también funciona con Gemini de Google y tu propia clave de Google AI Studio, que puede ser gratuita; con una clave gratuita, Google puede usar lo que se envía para mejorar sus productos, y Clícalo te lo dice antes de pedirte permiso."
en: "“Create with AI” also works with Google’s Gemini and your own Google AI Studio key, which can be free; with a free key, Google may use what is sent to improve its products, and Clícalo tells you before asking for your permission."
