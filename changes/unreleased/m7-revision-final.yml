# Novedad para usuarios (ACT-004, blueprint §11): la app la muestra y viaja en el manifiesto firmado.
# Una frase por idioma, en palabras de usuario, sin jerga ni nombres internos.
type: fix # feat, fix, a11y o perf
es: "La pestaña ya no cambia de tamaño al pasar de página ni se pliega bajo el dedo, «Soltar todo» se ve entero y no tapa otras ventanas, cambiar de vista suelta lo que estaba pulsado y al importar un perfil ves exactamente qué abre o ejecuta cada atajo antes de instalarlo."
en: "The Tab no longer changes size when you turn the page nor folds under your finger, «Release all» shows whole and no longer covers other windows, changing the view releases whatever was held, and when you import a profile you see exactly what each shortcut opens or runs before installing it."
