# Novedad para usuarios (ACT-004, blueprint §11): la app la muestra y viaja en el manifiesto firmado.
# Una frase por idioma, en palabras de usuario, sin jerga ni nombres internos.
type: fix # feat, fix, a11y o perf
es: "La pestaña ya no se queda colgada al cambiarla de lado, aparece directamente a su tamaño, responde más rápido y Clícalo arranca aunque la barra de tareas de Windows aún no esté lista."
en: "The Tab no longer freezes when you move it to another side, appears at its size straight away, responds faster, and Clícalo starts even if the Windows taskbar is not ready yet."
