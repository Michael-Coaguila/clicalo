# Novedad para usuarios (ACT-004, blueprint §11): la app la muestra y viaja en el manifiesto firmado.
# Una frase por idioma, en palabras de usuario, sin jerga ni nombres internos.
type: fix # feat, fix, a11y o perf
es: "Ajustes rápidos se abre y se cierra de una vez, sin que el panel salte ni se salga de la pantalla, y las ventanas junto a la pestaña ya no cambian de tamaño al aparecer."
en: "Quick settings opens and closes in one go, without the panel jumping or leaving the screen, and the windows beside the tab no longer change size as they appear."
