# Novedad para usuarios (ACT-004, blueprint §11): la app la muestra y viaja en el manifiesto firmado.
# Una frase por idioma, en palabras de usuario, sin jerga ni nombres internos.
type: a11y # feat, fix, a11y o perf
es: "Narrador y Acceso por voz dicen ahora qué opción está elegida, qué sección está abierta o cerrada y qué teclas siguen pulsadas cuando aparece «Soltar todo»."
en: "Narrator and Voice Access now say which option is chosen, which section is open or closed, and which keys are still held when “Release all” appears."
