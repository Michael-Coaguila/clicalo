# Novedad para usuarios (ACT-004, blueprint §11): la app la muestra y viaja en el manifiesto firmado.
# Una frase por idioma, en palabras de usuario, sin jerga ni nombres internos.
type: feat # feat, fix, a11y o perf
es: "Ninguna tecla se queda pulsada: «Soltar todo» está siempre a la vista y las teclas se sueltan solas al cambiar de app, al bloquear el equipo o si Clícalo se cierra por un error."
en: "No key ever stays stuck: “Release all” is always in view, and keys release by themselves when you switch apps, lock the computer or if Clícalo closes because of an error."
